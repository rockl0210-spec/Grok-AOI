# ============================================================================
# AOI preprocessing v2 - REAL-DATA config (per mode).  Rule: only the true physical boundary / external background
# and fixtures are excluded from the ROI; specular, uneven/dim light, rough band, water marks, oil films stay INSIDE the
# ROI and are only LABELLED (NN_nuisance.png bit-flags).  `pipeline: v2` selects aoi_preprocess/pipeline_v2.py.
# (config.yaml = the v1 pipeline, kept unchanged.)   px = full-res px, levels = 8-bit gray levels.
# ============================================================================
mode_rules:
  edge: [edge]
  side: [side]
default_mode: null
safety:
  protected_out_roots: []
  max_files_without_flag: 24
common:
  input: {full_scale: null, color_to_gray: luma, recursive: false}
  output:
    write_debug: true
    debug_files: [corrected, classes, overlay, maps]
    overlay_alpha: 0.45
    preview_percentiles: [0.5, 99.5]
  noise_map: {hp_sigma_px: 1.5, block_px: 32, smooth_blocks: 1.0, min_valid_frac: 0.25, scale_x: 100}
modes:
  edge:
    illumination:
      flat_path: null
      dark_path: null
      source: hybrid
      mode: divide
      target_level: null
      bg_floor_frac: 0.05
      weight_erode_px: 20
      background: {method: gaussian, gaussian_sigma_px: 150, work_max_side: 616, robust_iters: 3, robust_clip_sigma: 3.0, morph_kernel_px: 151, morph_smooth_sigma_px: 40,
        poly_degree: 3}
      sequence: {n_frames: 9, min_frames: 5, smooth_px: 4, gain_sigma_px: 150}
      local_norm: {enabled: true, sigma_px: 60, robust_iters: 3, robust_clip_sigma: 3.0}
    denoise:
      method: nlm
      median: {ksize: 3}
      bilateral: {diameter: 5, sigma_color: 0.03, sigma_space: 1.5}
      nlm: {patch_size: 3, patch_distance: 4, h_factor: 0.5}
    roi:
      kind: edge
      structure: {blur_px: 3, plateau_percentile: 90, background_percentile: 1, min_contrast_levels: 40, threshold_frac: 0.25, morph_px: 15, border_touch_frac: 0.25,
        line_tol_px: 4, edge_margin_px: 30, level_sigma_px: 16, level_ref_percentile: 75, bg_min_extent_frac: 0.5}
      border_margin_px: 0
      fixture_auto: {enabled: false, bright_ratio: 1.5, dark_ratio: 0.45, open_px: 15, close_px: 25, min_area_px: 20000, edge_zone_px: 0, margin_px: 8,
        require_border_touch: true}
      fixture_rects: []
    abnormal:
      max_bg_frac: 0.12
      min_line_inlier_frac: 0.85
      max_dim_frac: 0.12
      expected_frames: ['00', '45']
    nuisance:
      specular: {sat_level: 250, sat_min_area_px: 20, sat_margin_px: 3, bright_level: null, bright_open_px: 9, bright_min_area_px: 3000, glow_margin_px: 40}
      uneven: {level_sigma_px: 16, ref_percentile: 75, dim_frac: 0.9, hot_frac: 1.12, min_abs_dev_levels: null, min_area_px: 5000, attach_px: 90, isolated_min_area_px: 400000}
      rough: {enabled: true, hp_sigma_px: 6, hp_threshold_levels: 6, window_px: 81, work_scale: 0.25, thr_high: 0.1, thr_low: 0.06, attach_px: 200, close_px: 61,
        margin_px: 10}
      lowfreq: {enabled: true, work_scale: 0.25, fine_sigma_px: 12, coarse_sigma_px: 80, k_sigma: 3.5, abs_min_levels: 1.5, grad_sigma_px: 6, max_grad_levels_per_px: 0.1,
        close_px: 15, open_px: 15, water_min_area_px: 8000, water_max_area_px: 400000, oil_min_area_px: 150000, sharp_min: 0.02, min_thickness_px: 120,
        defect_suppress_px: 100}
    registration: {enabled: true, work_scale: 0.25, hp_sigma_px: 8, min_response: 0.2, max_line_shift_px: 300, consistency_tol_px: 20}
  side:
    illumination:
      flat_path: null
      dark_path: null
      source: self
      mode: subtract
      target_level: 0.08
      bg_floor_frac: 0.05
      weight_erode_px: 12
      background: {method: gaussian, gaussian_sigma_px: 120, work_max_side: 616, robust_iters: 3, robust_clip_sigma: 3.0, morph_kernel_px: 151, morph_smooth_sigma_px: 40,
        poly_degree: 3}
      sequence: {n_frames: 0, min_frames: 0, smooth_px: 0, gain_sigma_px: 0}
      local_norm: {enabled: true, sigma_px: 60, robust_iters: 3, robust_clip_sigma: 3.0}
    denoise:
      method: nlm
      median: {ksize: 3}
      bilateral: {diameter: 5, sigma_color: 0.02, sigma_space: 1.5}
      nlm: {patch_size: 3, patch_distance: 4, h_factor: 0.5}
    roi:
      kind: side
      strip:
        col_blocks: 32
        row_smooth_px: 1.5
        step_px: 2
        min_step_levels: 1.5
        vote_tol_px: 4
        min_confidence: 0.3
        top_search_frac: [0.11, 0.18]
        bottom_search_frac: [0.81, 0.88]
        fallback_rows_frac: [0.141, 0.846]
        boundary_margin_px: 8
        consensus_tol_px: 12
      fixture_auto: {enabled: false, bright_ratio: 8.0, dark_ratio: null, open_px: 15, close_px: 25, min_area_px: 20000, edge_zone_px: 0, margin_px: 8}
      end: {band_level: 200, band_open_px: 9, band_min_area_px: 3000, band_min_height_frac: 0.6, band_max_width_frac: 0.25, band_margin_px: 40, min_ratio: 1.5,
        profile_sigma_px: 3, step_levels_per_px: 0.35, step_run_px: 4, boundary_margin_px: 8}
    abnormal:
      expected_frames: ['00', '15']
    nuisance:
      specular: {sat_level: 250, sat_min_area_px: 20, sat_margin_px: 3, bright_level: 200, bright_open_px: 9, bright_min_area_px: 3000, glow_margin_px: 40}
      uneven: {level_sigma_px: 24, ref_percentile: 50, dim_frac: 0.65, hot_frac: 1.6, min_abs_dev_levels: 4, min_area_px: 20000, attach_px: 0, isolated_min_area_px: 0}
      rough: {enabled: false}
      lowfreq: {enabled: true, work_scale: 0.25, fine_sigma_px: 12, coarse_sigma_px: 80, k_sigma: 3.5, abs_min_levels: 1.5, grad_sigma_px: 6, max_grad_levels_per_px: 0.1,
        close_px: 15, open_px: 15, water_min_area_px: 8000, water_max_area_px: 400000, oil_min_area_px: 150000, sharp_min: 0.02, min_thickness_px: 120,
        defect_suppress_px: 100}
    registration: {enabled: false}
pipeline: v2
